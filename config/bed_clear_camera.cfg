# Camera checker configuration for Klipper Bed Clear.
#
# This file is read by camera_checker.py. It is not included by Klipper.
# Restart the checker service after editing:
#   sudo systemctl restart bed_clear_camera

[camera]
# Webcam still-image URL. Leave empty to discover the webcam through
# Moonraker using moonraker_url and webcam below.
snapshot_url:

# Command that writes an image to stdout. Takes precedence over snapshot_url.
# Example:
#   snapshot_command: libcamera-still -o - -t 200 --nopreview
snapshot_command:

# Moonraker discovery. Leave webcam empty to use the first webcam.
moonraker_url: http://127.0.0.1:7125
webcam:

# Moonraker API key, if authentication is enabled.
api_key:

# Local HTTP service.
listen_host: 127.0.0.1
listen_port: 7126

# Baseline and debug images.
data_dir: ~/printer_data/bed_clear

# Detection backend:
#   diff  - image difference against the empty-bed baseline (no model)
#   model - ONNX model only
#   both  - diff and model must both report clear
backend: diff

# Model files produced by training/train.py. Copy model.onnx and config.json
# here, or point these at the training run directory.
model_path: ~/printer_data/bed_clear/model.onnx
model_config: ~/printer_data/bed_clear/model_config.json

# Optional override for the threshold stored in the model config.
#model_threshold: 0.5

# ONNX Runtime CPU threads for inference. Keep this at 1 so a check does not
# spike all CPU cores while Klipper and the webcam are running.
model_threads: 1

# Image comparison. decode_size is the grayscale grid (width, height).
decode_size: 80, 60

# Region of interest, normalised [x0, y0, x1, y1]. 0,0 is top-left.
roi: 0.0, 0.0, 1.0, 1.0

# A cell counts as changed above this normalised brightness difference.
cell_threshold: 0.35

# Smallest connected changed blob that counts as an object, in cells.
min_component_cells: 6

# Block if this fraction of the ROI changed, even without a large blob.
max_changed_fraction: 0.25

snapshot_timeout: 10.0
save_debug: true

# Optional shared secret. Must match token in bed_clear.cfg.
token:
