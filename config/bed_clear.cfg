# Camera based bed clear detection
#
# Add this to printer.cfg:
#   [include bed_clear.cfg]
#
# The camera checker service must be running (see README.md). Run
# BED_CLEAR_CALIBRATE with an empty bed before the first BED_CLEAR_CHECK.

[bed_clear]
# camera: ask the camera checker. manual: only BED_CLEAR_CONFIRM clears.
method: camera

# Local camera checker service.
checker_url: http://127.0.0.1:7126
check_timeout: 20

# Optional shared secret. Must match "token" in bed_clear_camera.cfg.
#token: change-me

# Run before every calibration and check so the toolhead is in the same place
# in the picture. This can be a macro name or ordinary gcode. Keep it safe if
# a part is still on the plate: raise Z before moving in XY.
#park_gcode: BED_CLEAR_PARK

# Wait after parking before taking the snapshot. Milliseconds.
settle_ms: 500

# Expire a clear result after this many seconds. 0 means it never expires.
#max_age: 1800

# Refuse M24 and SDCARD_PRINT_FILE when the bed is not verified clear.
# Needs a recent Klipper; otherwise a warning is logged and BED_CLEAR_GATE
# still works.
#block_print_start: False

# When a print is about to start and the bed is not verified, take a camera
# snapshot automatically and allow the job only if the bed is clear. This
# installs the same start guard as block_print_start. Requires method: camera.
#auto_check_on_start: False

# Klipper state and metrics. The camera baseline lives in the checker's
# data_dir instead.
#data_file: ~/printer_data/config/bed_clear.json

# Example parking macro. Adjust the coordinates and Z height for your printer.
#[gcode_macro BED_CLEAR_PARK]
#gcode:
#    G1 Z30 F600
#    G1 X10 Y10 F6000
